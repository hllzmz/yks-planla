<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YKS Program Planlayıcı</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #16a34a;
      --success-hover: #15803d;
      --danger: #dc2626;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    /* Üst Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--primary-soft); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700;
    }
    .brand-title { font-weight: 700; font-size: 15px; }
    .brand-sub { font-size: 11px; color: var(--muted); }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Form & Butonlar */
    .input, .select {
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 6px 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .input:focus, .select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
    }
    .btn {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: var(--success-hover); }
    .btn-outline { background: #fff; color: var(--primary); border-color: #bfdbfe; }
    .btn-outline:hover { background: var(--primary-soft); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { background: #f1f5f9; color: var(--text); }
    .btn-danger-ghost { background: transparent; color: var(--danger); }
    .btn-danger-ghost:hover { background: #fef2f2; }
    .btn-sm { padding: 4px 8px; font-size: 12px; }
    .btn-xs { padding: 2px 6px; font-size: 11px; border-radius: 5px; }

    .segmented {
      display: inline-flex;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-alt);
    }
    .segmented button {
      border: none;
      background: transparent;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .segmented button.active {
      background: var(--primary);
      color: #fff;
    }

    /* İki Sütunlu Ana Alan */
    .layout {
      max-width: 1560px;
      margin: 0 auto;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr);
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
      .right-panel { position: static !important; }
    }

    /* Sol Panel: Program */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .week-tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius);
      margin-bottom: 10px;
    }
    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-primary { background: var(--primary); color: #fff; }
    .badge-soft { background: #e2e8f0; color: #334155; }

    .day-card {
      margin-bottom: 10px;
      overflow: hidden;
      border-left-width: 4px;
      border-left-style: solid;
    }
    .day-card.active {
      outline: 2px solid var(--primary);
      outline-offset: -1px;
    }
    .day-PAZARTESİ { border-left-color: #3b82f6; }
    .day-SALI { border-left-color: #6366f1; }
    .day-ÇARŞAMBA { border-left-color: #8b5cf6; }
    .day-PERŞEMBE { border-left-color: #14b8a6; }
    .day-CUMA { border-left-color: #10b981; }
    .day-CUMARTESİ { border-left-color: #f59e0b; }
    .day-PAZAR { border-left-color: #f43f5e; }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .day-card.active .day-header { background: #dbeafe; }
    .day-title { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .day-meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }

    .task-list { divide-y: 1px solid #f1f5f9; }
    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 12px;
      border-bottom: 1px solid #f1f5f9;
    }
    .task-row:last-child { border-bottom: none; }
    .task-row:hover { background: #f8fafc; }
    .task-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .task-topic-input {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: var(--text);
    }
    .task-topic-input:hover, .task-topic-input:focus {
      border-color: #cbd5e1;
      background: #fff;
      outline: none;
    }
    .task-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .q-input { width: 64px; text-align: center; padding: 4px 6px; font-size: 12px; }
    .type-select { padding: 4px 6px; font-size: 12px; }
    .empty-day { padding: 10px 12px; font-size: 12px; color: #94a3b8; font-style: italic; }

    /* Sağ Panel: Müfredat */
    .right-panel {
      position: sticky;
      top: 70px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
    }
    .curriculum-scroll {
      max-height: calc(100vh - 305px);
      min-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (max-width: 560px) { .subject-grid { grid-template-columns: 1fr; } }
    .subject-card {
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.12s;
    }
    .subject-card:hover { border-color: var(--primary); background: var(--primary-soft); }

    .unit-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .subject-header {
      background: #f1f5f9;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      display: flex;
      justify-content: space-between;
    }
    details.unit-details { border-top: 1px solid #f1f5f9; }
    details.unit-details summary {
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      background: #fff;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    details.unit-details summary::-webkit-details-marker { display: none; }
    details.unit-details summary:hover { background: #f8fafc; }
    .unit-subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      background: #f8fafc;
      border-top: 1px solid #f1f5f9;
      border-bottom: 1px solid #f1f5f9;
      font-size: 11px;
      color: var(--muted);
    }
    .topic-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .topic-row:last-child { border-bottom: none; }
    .topic-row:hover { background: #eff6ff55; }
    .topic-title { font-size: 12.5px; font-weight: 500; color: var(--text); }
    .topic-meta { font-size: 10.5px; color: #94a3b8; }

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      display: none; align-items: center; justify-content: center;
      z-index: 60; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; border-radius: 12px; width: 480px; max-width: 100%;
      padding: 18px 20px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .toast {
      position: fixed; bottom: 18px; right: 18px; z-index: 80;
      background: #0f172a; color: #fff; padding: 9px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <!-- Üst Araç Çubuğu -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">📅</div>
      <div>
        <div class="brand-title">YKS Program Planlayıcı</div>
        <div class="brand-sub">2027 &amp; 2028 Müfredat · Orijinal Excel Şablon Aktarımı</div>
      </div>
    </div>

    <div class="toolbar">
      <input id="studentName" class="input" style="width: 195px" placeholder="Öğrenci Adı Soyadı..." />

      <div class="segmented" id="modeToggle">
        <button data-mode="single" class="active">Tek Haftalık Şablon</button>
        <button data-mode="compact">4 Haftalık Kompakt</button>
        <button data-mode="monthly">Aylık Gelişim Matrisi</button>
      </div>

      <button class="btn btn-outline" id="btnRoutine">↻ Rutin Dağıt</button>
      <button class="btn btn-outline" id="btnNewProgram" title="Öğrenci adını ve tüm haftaları sıfırlayarak yeni program başlatır">🆕 Yeni Program</button>
      <button class="btn btn-danger-ghost" id="btnClear" title="Sadece aktif haftayı temizler">Temizle</button>
      <button class="btn btn-success" id="btnExport">⬇ Excel Olarak İndir</button>
    </div>
  </header>

  <main class="layout">
    <!-- SOL PANEL: HAFTALIK PROGRAM -->
    <section>
      <div id="weekTabs" class="week-tabs" style="display:none"></div>

      <div class="card summary-bar">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
          <label style="font-size:12px; color:#64748b; font-weight:600">Hafta Başlığı:</label>
          <input id="weekLabelInput" class="input" style="width:185px" placeholder="Örn: 16 Şubat Haftası" />
        </div>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
          <span class="badge badge-primary" id="activeDayBadge">Aktif Gün: PAZARTESİ</span>
          <span id="weekTotalLabel" style="font-size:13px; font-weight:700; color:#334155">0 görev · 0 soru</span>
        </div>
      </div>

      <div id="daysContainer"></div>
    </section>

    <!-- SAĞ PANEL: 2027 & 2028 YKS MÜFREDATI -->
    <aside class="card right-panel">
      <div style="display:flex; align-items:center; justify-content:space-between">
        <strong style="font-size:15px">YKS Konu Havuzu</strong>
        <span id="targetDayHint" style="font-size:12px; font-weight:700; color:var(--primary)">Eklenecek Gün: PAZARTESİ</span>
      </div>

      <div class="segmented" id="yearToggle" style="width:100%">
        <button data-year="2027" class="active" style="flex:1">2027 YKS (MEB 2018)</button>
        <button data-year="2028" style="flex:1">2028 YKS (Maarif Modeli)</button>
      </div>

      <div class="filter-row">
        <select id="filterSession" class="select" style="width:92px">
          <option value="Tümü">Tümü</option>
          <option value="TYT" selected>TYT</option>
          <option value="AYT">AYT</option>
          <option value="YDT">YDT</option>
        </select>
        <select id="filterPuan" class="select" style="width:92px">
          <option value="Tümü">Tüm Alan</option>
          <option value="SAY">SAY</option>
          <option value="EA">EA</option>
          <option value="SÖZ">SÖZ</option>
          <option value="DİL">DİL</option>
        </select>
        <select id="filterDers" class="select" style="flex:1; min-width:140px">
          <option value="Tümü">Tüm Dersler</option>
        </select>
      </div>

      <input id="searchInput" class="input" placeholder="Konu, ünite veya kazanım ara (örn: trigonometri, paragraf)..." />

      <div class="quick-bar">
        <span style="font-size:12px; font-weight:600; color:#475569">Hızlı Ekle:</span>
        <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap">
          <select id="defaultType" class="select type-select">
            <option value="Konu">Konu</option>
            <option value="Soru Çözümü" selected>Soru Çözümü</option>
            <option value="Tekrar">Tekrar</option>
            <option value="Deneme">Deneme</option>
          </select>
          <input id="defaultQuestions" type="number" min="0" step="5" value="30" class="input q-input" />
          <button class="btn btn-outline btn-xs q-preset" data-q="0">Konu</button>
          <button class="btn btn-outline btn-xs q-preset" data-q="20">20</button>
          <button class="btn btn-outline btn-xs q-preset" data-q="30">30</button>
          <button class="btn btn-outline btn-xs q-preset" data-q="40">40</button>
          <button class="btn btn-outline btn-xs q-preset" data-q="50">50</button>
        </div>
      </div>

      <div id="curriculumList" class="curriculum-scroll"></div>
    </aside>
  </main>

  <!-- MODALLAR -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal" id="modalContent"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const DAYS = ["PAZARTESİ", "SALI", "ÇARŞAMBA", "PERŞEMBE", "CUMA", "CUMARTESİ", "PAZAR"];
    const STUDY_TYPES = ["Konu", "Soru Çözümü", "Tekrar", "Deneme"];
    const MATRIX_SUBJECTS = [
      "TÜRKÇE", "TEMEL MATEMATİK", "TYT GEOMETRİ", "TYT FİZİK", "TYT KİMYA", "TYT BİYOLOJİ",
      "TYT TARİH", "TYT COĞRAFYA", "TYT FELSEFE", "TYT DİN KÜLTÜRÜ",
      "AYT MATEMATİK", "AYT GEOMETRİ", "AYT FİZİK", "AYT KİMYA", "AYT BİYOLOJİ",
      "TÜRK DİLİ VE EDEBİYATI", "AYT TARİH 1", "AYT TARİH 2", "AYT COĞRAFYA 1", "AYT COĞRAFYA 2",
      "AYT FELSEFE GRUBU", "AYT DİN KÜLTÜRÜ"
    ];
    const STORAGE_KEY = "yks_planla_state_v1";

    function emptyWeek() {
      const w = {};
      for (const d of DAYS) w[d] = [];
      return w;
    }

    function emptyMatrixWeek() {
      const m = {};
      for (const s of MATRIX_SUBJECTS) m[s] = { topics: [], target_questions: null };
      return m;
    }

    function ensureMatrixShape(obj) {
      if (!Array.isArray(obj.monthly_matrix) || obj.monthly_matrix.length !== 4) {
        obj.monthly_matrix = [emptyMatrixWeek(), emptyMatrixWeek(), emptyMatrixWeek(), emptyMatrixWeek()];
      } else {
        obj.monthly_matrix = obj.monthly_matrix.map(mw => {
          const clean = emptyMatrixWeek();
          for (const s of MATRIX_SUBJECTS) {
            if (mw && mw[s]) {
              clean[s] = {
                topics: Array.isArray(mw[s].topics) ? mw[s].topics : [],
                target_questions: mw[s].target_questions || null,
              };
            }
          }
          return clean;
        });
      }
      if (!obj.active_matrix_subject || !MATRIX_SUBJECTS.includes(obj.active_matrix_subject)) {
        obj.active_matrix_subject = "TÜRKÇE";
      }
      return obj;
    }

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.weeks) && parsed.weeks.length === 4) {
            return ensureMatrixShape(parsed);
          }
        }
      } catch (e) {}
      return ensureMatrixShape({
        student_name: "",
        template_mode: "single",
        active_week_idx: 0,
        week_labels: ["1. Hafta", "2. Hafta", "3. Hafta", "4. Hafta"],
        weeks: [emptyWeek(), emptyWeek(), emptyWeek(), emptyWeek()],
        active_day: "PAZARTESİ",
      });
    }

    const state = loadSavedState();
    const filterState = {
      year: 2027,
      session: "TYT",
      puan_turu: "Tümü",
      ders: "Tümü",
      q: "",
    };

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function currentWeekIdx() {
      return state.template_mode === "single" ? 0 : state.active_week_idx;
    }
    function currentWeek() {
      return state.weeks[currentWeekIdx()];
    }

    function mapTopicToMatrixSubject(fullDers, preferredSubject) {
      const parts = String(fullDers || "").trim().split(/\s+/);
      const sess = (parts[0] || "").toUpperCase();
      const ders = parts.slice(1).join(" ");
      if (sess === "TYT") {
        const map = {
          "Türkçe": "TÜRKÇE",
          "Matematik": "TEMEL MATEMATİK",
          "Geometri": "TYT GEOMETRİ",
          "Fizik": "TYT FİZİK",
          "Kimya": "TYT KİMYA",
          "Biyoloji": "TYT BİYOLOJİ",
          "Tarih": "TYT TARİH",
          "Coğrafya": "TYT COĞRAFYA",
          "Felsefe": "TYT FELSEFE",
          "Din Kültürü": "TYT DİN KÜLTÜRÜ",
        };
        if (map[ders]) return map[ders];
      }
      if (sess === "AYT") {
        if (ders === "Tarih") {
          return (preferredSubject === "AYT TARİH 1" || preferredSubject === "AYT TARİH 2")
            ? preferredSubject : "AYT TARİH 1";
        }
        if (ders === "Coğrafya") {
          return (preferredSubject === "AYT COĞRAFYA 1" || preferredSubject === "AYT COĞRAFYA 2")
            ? preferredSubject : "AYT COĞRAFYA 1";
        }
        const map = {
          "Matematik": "AYT MATEMATİK",
          "Geometri": "AYT GEOMETRİ",
          "Fizik": "AYT FİZİK",
          "Kimya": "AYT KİMYA",
          "Biyoloji": "AYT BİYOLOJİ",
          "Türk Dili ve Edebiyatı": "TÜRK DİLİ VE EDEBİYATI",
          "Felsefe": "AYT FELSEFE GRUBU",
          "Mantık": "AYT FELSEFE GRUBU",
          "Psikoloji": "AYT FELSEFE GRUBU",
          "Sosyoloji": "AYT FELSEFE GRUBU",
          "Din Kültürü": "AYT DİN KÜLTÜRÜ",
        };
        if (map[ders]) return map[ders];
      }
      return preferredSubject && MATRIX_SUBJECTS.includes(preferredSubject) ? preferredSubject : "TÜRKÇE";
    }

    let toastTimer = null;
    function notify(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ------------------------------------------------------------------ //
    // Sol Panel Çizimi
    // ------------------------------------------------------------------ //
    function renderSchedule() {
      saveState();
      const idx = currentWeekIdx();
      const week = currentWeek();
      const isMonthly = state.template_mode === "monthly";

      document.getElementById("studentName").value = state.student_name || "";
      document.getElementById("weekLabelInput").value = state.week_labels[idx] || `${idx + 1}. Hafta`;

      document.querySelectorAll("#modeToggle button").forEach(b => {
        b.classList.toggle("active", b.dataset.mode === state.template_mode);
      });

      const btnRoutine = document.getElementById("btnRoutine");
      if (btnRoutine) btnRoutine.style.display = isMonthly ? "none" : "inline-flex";

      // 4 Haftalık Sekmeler (Kompakt + Aylık Matris)
      const weekTabs = document.getElementById("weekTabs");
      if (state.template_mode === "compact" || isMonthly) {
        weekTabs.style.display = "flex";
        let html = '<div style="display:flex; gap:6px; flex-wrap:wrap">';
        for (let i = 0; i < 4; i++) {
          const cnt = isMonthly
            ? MATRIX_SUBJECTS.reduce((acc, s) => acc + (state.monthly_matrix[i][s]?.topics?.length || 0), 0)
            : DAYS.reduce((acc, d) => acc + (state.weeks[i][d]?.length || 0), 0);
          const cls = i === state.active_week_idx ? "btn btn-primary btn-sm" : "btn btn-outline btn-sm";
          html += `<button class="${cls}" onclick="selectWeek(${i})">${i + 1}. Hafta (${cnt})</button>`;
        }
        html += "</div><div style='display:flex; gap:6px; flex-wrap:wrap'>";
        if (isMonthly) {
          html += `<button class="btn btn-outline btn-sm" onclick="importWeeksToMatrix()">⇄ 4 Haftalıktan Aktar</button>`;
        }
        if (state.active_week_idx < 3) {
          html += `<button class="btn btn-outline btn-sm" onclick="copyToNextWeek()">📋 ${state.active_week_idx + 2}. Haftaya Kopyala</button>`;
        }
        html += "</div>";
        weekTabs.innerHTML = html;
      } else {
        weekTabs.style.display = "none";
      }

      const container = document.getElementById("daysContainer");

      if (isMonthly) {
        const mWeek = state.monthly_matrix[idx];
        let totalTopics = 0;
        let weekQ = 0;
        let monthQ = 0;
        for (const s of MATRIX_SUBJECTS) {
          totalTopics += mWeek[s].topics.length;
          weekQ += Number(mWeek[s].target_questions || 0);
          for (let wi = 0; wi < 4; wi++) {
            monthQ += Number(state.monthly_matrix[wi][s]?.target_questions || 0);
          }
        }
        document.getElementById("activeDayBadge").textContent = `Aktif Satır: ${state.active_matrix_subject}`;
        document.getElementById("targetDayHint").textContent = `Eşlenecek: Otomatik (${idx + 1}. Hafta)`;
        document.getElementById("weekTotalLabel").textContent = `${idx + 1}. Hafta: ${totalTopics} konu · ${weekQ} soru (Aylık: ${monthQ})`;

        container.innerHTML = MATRIX_SUBJECTS.map(subj => {
          const entry = mWeek[subj] || { topics: [], target_questions: null };
          const isActive = state.active_matrix_subject === subj;
          const subjMonthQ = [0, 1, 2, 3].reduce((acc, wi) => acc + Number(state.monthly_matrix[wi][subj]?.target_questions || 0), 0);
          const otherWeeksCount = [0, 1, 2, 3]
            .map(wi => `${wi + 1}.H:${state.monthly_matrix[wi][subj]?.topics?.length || 0}`)
            .join(" · ");

          const topicsHtml = entry.topics.length === 0
            ? `<div class="empty-day">Bu hafta için konu eklenmedi. Sağdan konu eklediğinizde otomatik buraya yerleşir.</div>`
            : `<div class="task-list">${entry.topics.map((topicText, ti) => `
                <div class="task-row">
                  <div class="task-main">
                    <input class="task-topic-input" value="${escapeHtml(topicText)}"
                      onchange="updateMatrixTopic('${subj}', ${ti}, this.value)" />
                  </div>
                  <div class="task-controls">
                    <button class="btn btn-ghost btn-xs" ${ti === 0 ? "disabled" : ""} onclick="moveMatrixTopic('${subj}', ${ti}, -1)">↑</button>
                    <button class="btn btn-ghost btn-xs" ${ti === entry.topics.length - 1 ? "disabled" : ""} onclick="moveMatrixTopic('${subj}', ${ti}, 1)">↓</button>
                    <button class="btn btn-danger-ghost btn-xs" onclick="deleteMatrixTopic('${subj}', ${ti})">✕</button>
                  </div>
                </div>
              `).join("")}</div>`;

          return `
            <div class="card day-card ${isActive ? "active" : ""}" style="border-left-color: ${subj.startsWith("AYT") || subj === "TÜRK DİLİ VE EDEBİYATI" ? "#8b5cf6" : "#2563eb"}">
              <div class="day-header" onclick="setActiveMatrixSubject('${subj}')">
                <div class="day-title">
                  ${isActive ? "📌 " : ""}${subj}
                  <span style="font-size:11px; font-weight:500; color:#64748b">(${otherWeeksCount})</span>
                </div>
                <div class="day-meta" onclick="event.stopPropagation()">
                  <span style="font-size:11px; color:#64748b">Hafta Soru:</span>
                  <input type="number" min="0" step="10" class="input q-input"
                    value="${entry.target_questions ?? 0}"
                    onchange="updateMatrixQuestions('${subj}', this.value)" />
                  <span style="font-size:11px; color:#64748b">Top: ${subjMonthQ}</span>
                  <button class="btn btn-outline btn-xs" onclick="openMatrixCustomModal('${subj}')">+ Özel</button>
                </div>
              </div>
              ${topicsHtml}
            </div>
          `;
        }).join("");
        return;
      }

      // Tek Haftalık veya 4 Haftalık Kompakt Görünümü
      document.getElementById("activeDayBadge").textContent = `Aktif Gün: ${state.active_day}`;
      document.getElementById("targetDayHint").textContent = `Eklenecek Gün: ${state.active_day}`;

      let totalTasks = 0;
      let totalQ = 0;
      for (const d of DAYS) {
        for (const t of week[d]) {
          totalTasks++;
          totalQ += Number(t.target_questions || 0);
        }
      }
      document.getElementById("weekTotalLabel").textContent = `Toplam: ${totalTasks} görev · ${totalQ} soru`;

      container.innerHTML = DAYS.map(day => {
        const tasks = week[day] || [];
        const isActive = state.active_day === day;
        const dayQ = tasks.reduce((a, t) => a + Number(t.target_questions || 0), 0);

        const rowsHtml = tasks.length === 0
          ? `<div class="empty-day">${isActive ? "Henüz konu eklenmedi. Sağ panelden '+ Ekle'ye tıklayın." : "Boş gün — eklemek için gün başlığına tıklayıp aktif yapın."}</div>`
          : `<div class="task-list">${tasks.map((t, i) => `
              <div class="task-row">
                <div class="task-main">
                  <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap">
                    <span class="badge badge-soft">${escapeHtml(t.ders)}</span>
                    ${t.note ? `<span style="font-size:11px; color:#64748b">(${escapeHtml(t.note)})</span>` : ""}
                  </div>
                  <input class="task-topic-input" value="${escapeHtml(t.konu)}"
                    onchange="updateTask('${day}', ${i}, 'konu', this.value)" />
                </div>
                <div class="task-controls">
                  <select class="select type-select" onchange="updateTask('${day}', ${i}, 'study_type', this.value)">
                    ${STUDY_TYPES.map(st => `<option value="${st}" ${t.study_type === st ? "selected" : ""}>${st}</option>`).join("")}
                  </select>
                  <input type="number" min="0" step="5" class="input q-input"
                    value="${t.target_questions ?? 0}"
                    onchange="updateTask('${day}', ${i}, 'target_questions', this.value)" />
                  <button class="btn btn-ghost btn-xs" title="Yukarı taşı" ${i === 0 ? "disabled" : ""} onclick="moveTask('${day}', ${i}, -1)">↑</button>
                  <button class="btn btn-ghost btn-xs" title="Aşağı taşı" ${i === tasks.length - 1 ? "disabled" : ""} onclick="moveTask('${day}', ${i}, 1)">↓</button>
                  <button class="btn btn-ghost btn-xs" title="Başka güne kopyala" onclick="openCopyModal('${day}', ${i})">📋</button>
                  <button class="btn btn-danger-ghost btn-xs" title="Sil" onclick="deleteTask('${day}', ${i})">✕</button>
                </div>
              </div>
            `).join("")}</div>`;

        return `
          <div class="card day-card day-${day} ${isActive ? "active" : ""}">
            <div class="day-header" onclick="setActiveDay('${day}')">
              <div class="day-title">
                ${isActive ? "📌 " : ""}${day}
                ${isActive ? '<span class="badge badge-primary">AKTİF GÜN</span>' : ""}
              </div>
              <div class="day-meta">
                <span>${tasks.length} görev · ${dayQ} soru</span>
                <button class="btn btn-outline btn-xs" onclick="event.stopPropagation(); openCustomModal('${day}')">+ Özel</button>
              </div>
            </div>
            ${rowsHtml}
          </div>
        `;
      }).join("");
    }

    // ------------------------------------------------------------------ //
    // Program İşlemleri
    // ------------------------------------------------------------------ //
    window.setActiveDay = (day) => { state.active_day = day; renderSchedule(); };
    window.setActiveMatrixSubject = (subj) => { state.active_matrix_subject = subj; renderSchedule(); };
    window.selectWeek = (idx) => { state.active_week_idx = idx; renderSchedule(); };

    window.copyToNextWeek = () => {
      const i = state.active_week_idx;
      if (i >= 3) return;
      if (state.template_mode === "monthly") {
        state.monthly_matrix[i + 1] = JSON.parse(JSON.stringify(state.monthly_matrix[i]));
      } else {
        state.weeks[i + 1] = JSON.parse(JSON.stringify(state.weeks[i]));
      }
      notify(`${i + 1}. Hafta → ${i + 2}. Haftaya kopyalandı`);
      renderSchedule();
    };

    window.importWeeksToMatrix = () => {
      const newMatrix = [emptyMatrixWeek(), emptyMatrixWeek(), emptyMatrixWeek(), emptyMatrixWeek()];
      for (let wi = 0; wi < 4; wi++) {
        for (const d of DAYS) {
          for (const t of (state.weeks[wi][d] || [])) {
            const targetSubj = mapTopicToMatrixSubject(t.ders, null);
            if (!targetSubj) continue;
            const entry = newMatrix[wi][targetSubj];
            if (t.konu && !entry.topics.includes(t.konu)) {
              entry.topics.push(t.konu);
            }
            if (t.target_questions) {
              entry.target_questions = (entry.target_questions || 0) + Number(t.target_questions);
            }
          }
        }
      }
      state.monthly_matrix = newMatrix;
      renderSchedule();
      notify("4 haftalık programdaki konular matrise aktarıldı");
    };

    window.updateMatrixTopic = (subj, idx, val) => {
      const entry = state.monthly_matrix[currentWeekIdx()][subj];
      if (entry) entry.topics[idx] = val;
      saveState();
    };
    window.moveMatrixTopic = (subj, idx, delta) => {
      const list = state.monthly_matrix[currentWeekIdx()][subj].topics;
      const next = idx + delta;
      if (next < 0 || next >= list.length) return;
      [list[idx], list[next]] = [list[next], list[idx]];
      renderSchedule();
    };
    window.deleteMatrixTopic = (subj, idx) => {
      state.monthly_matrix[currentWeekIdx()][subj].topics.splice(idx, 1);
      renderSchedule();
    };
    window.updateMatrixQuestions = (subj, val) => {
      const num = parseInt(val, 10);
      state.monthly_matrix[currentWeekIdx()][subj].target_questions = num > 0 ? num : null;
      renderSchedule();
    };
    window.openMatrixCustomModal = (subj) => {
      openModal(`
        <div class="modal-title">${subj} — Özel Konu Ekle (${currentWeekIdx() + 1}. Hafta)</div>
        <div class="field"><label>Konu / Açıklama</label><input id="mcKonu" class="input" style="width:100%" placeholder="Örn: Paragraf Denemesi / Tekrar" /></div>
        <div class="field"><label>Eklenecek Hedef Soru (İsteğe bağlı)</label><input id="mcQ" type="number" min="0" step="5" class="input" style="width:100%" value="0" /></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
          <button class="btn btn-primary" onclick="saveMatrixCustom('${subj}')">Ekle</button>
        </div>
      `);
    };
    window.saveMatrixCustom = (subj) => {
      const konu = document.getElementById("mcKonu").value.trim();
      if (!konu) return alert("Konu alanı zorunludur.");
      const q = parseInt(document.getElementById("mcQ").value || "0", 10);
      const entry = state.monthly_matrix[currentWeekIdx()][subj];
      entry.topics.push(konu);
      if (q > 0) entry.target_questions = (entry.target_questions || 0) + q;
      state.active_matrix_subject = subj;
      closeModal();
      renderSchedule();
    };

    window.updateTask = (day, idx, field, val) => {
      const t = currentWeek()[day][idx];
      if (!t) return;
      if (field === "target_questions") {
        const num = parseInt(val, 10);
        t.target_questions = num > 0 ? num : null;
      } else {
        t[field] = val;
      }
      renderSchedule();
    };

    window.moveTask = (day, idx, delta) => {
      const list = currentWeek()[day];
      const next = idx + delta;
      if (next < 0 || next >= list.length) return;
      [list[idx], list[next]] = [list[next], list[idx]];
      renderSchedule();
    };

    window.deleteTask = (day, idx) => {
      currentWeek()[day].splice(idx, 1);
      renderSchedule();
    };

    function getQuickDefaults() {
      const st = document.getElementById("defaultType").value;
      const q = parseInt(document.getElementById("defaultQuestions").value || "0", 10);
      return { study_type: st, target_questions: q > 0 ? q : null };
    }

    window.addTopic = (fullDers, konu) => {
      const { study_type, target_questions } = getQuickDefaults();
      if (state.template_mode === "monthly") {
        const subj = mapTopicToMatrixSubject(fullDers, state.active_matrix_subject);
        const entry = state.monthly_matrix[currentWeekIdx()][subj];
        if (!entry.topics.includes(konu)) entry.topics.push(konu);
        if (target_questions) entry.target_questions = (entry.target_questions || 0) + target_questions;
        state.active_matrix_subject = subj;
        renderSchedule();
        notify(`'${konu}' → ${subj} (${currentWeekIdx() + 1}. Hafta)`);
        return;
      }
      currentWeek()[state.active_day].push({
        ders: fullDers,
        konu: konu,
        study_type,
        target_questions,
        note: "",
      });
      renderSchedule();
      notify(`'${konu}' → ${state.active_day} gününe eklendi`);
    };

    window.addUnitTopics = (topicsJsonEnc, unitName) => {
      const topics = JSON.parse(decodeURIComponent(topicsJsonEnc));
      const { study_type, target_questions } = getQuickDefaults();
      if (state.template_mode === "monthly") {
        let lastSubj = state.active_matrix_subject;
        for (const t of topics) {
          const subj = mapTopicToMatrixSubject(t.full_ders, state.active_matrix_subject);
          const entry = state.monthly_matrix[currentWeekIdx()][subj];
          if (!entry.topics.includes(t.konu)) entry.topics.push(t.konu);
          if (target_questions) entry.target_questions = (entry.target_questions || 0) + target_questions;
          lastSubj = subj;
        }
        state.active_matrix_subject = lastSubj;
        renderSchedule();
        notify(`'${unitName}' (${topics.length} konu) → ${lastSubj}`);
        return;
      }
      for (const t of topics) {
        currentWeek()[state.active_day].push({
          ders: t.full_ders,
          konu: t.konu,
          study_type,
          target_questions,
          note: "",
        });
      }
      renderSchedule();
      notify(`'${unitName}' (${topics.length} konu) → ${state.active_day}`);
    };

    // ------------------------------------------------------------------ //
    // Sağ Panel: Müfredat JSON Yükleme (GitHub Pages + Yerel Ortak)
    // ------------------------------------------------------------------ //
    const curriculumCache = {};

    function trLower(text) {
      return String(text ?? "")
        .replace(/İ/g, "i")
        .replace(/I/g, "ı")
        .replace(/Ş/g, "ş")
        .replace(/Ğ/g, "ğ")
        .replace(/Ü/g, "ü")
        .replace(/Ö/g, "ö")
        .replace(/Ç/g, "ç")
        .toLowerCase();
    }

    async function getYearTopics(year) {
      if (!curriculumCache[year]) {
        const res = await fetch(`./data/mufredat_${year}.json`);
        if (!res.ok) throw new Error("Müfredat JSON yüklenemedi");
        const json = await res.json();
        curriculumCache[year] = json.topics.map(t => ({
          ...t,
          full_ders: `${t.session} ${t.ders}`,
        }));
      }
      return curriculumCache[year];
    }

    async function getFilteredTopics({ year, session, puan_turu, ders, q }) {
      let results = await getYearTopics(year);
      if (session && session !== "Tümü") {
        results = results.filter(t => t.session === session);
      }
      if (puan_turu && puan_turu !== "Tümü") {
        results = results.filter(t =>
          t.session === "TYT" || (t.puan_turu && t.puan_turu.includes(puan_turu))
        );
      }
      if (ders && ders !== "Tümü") {
        results = results.filter(t => t.ders === ders);
      }
      const query = trLower(String(q || "").trim());
      if (query) {
        results = results.filter(t =>
          trLower(t.konu).includes(query) ||
          trLower(t.unite).includes(query) ||
          trLower(t.ders).includes(query) ||
          trLower(t.kazanim).includes(query)
        );
      }
      return results;
    }

    async function refreshSubjectsDropdown() {
      const topics = await getFilteredTopics({
        year: filterState.year,
        session: filterState.session,
        puan_turu: filterState.puan_turu,
        ders: "Tümü",
        q: "",
      });
      const names = [];
      for (const t of topics) {
        if (!names.includes(t.ders)) names.push(t.ders);
      }
      const sel = document.getElementById("filterDers");
      if (filterState.ders !== "Tümü" && !names.includes(filterState.ders)) {
        filterState.ders = "Tümü";
      }
      sel.innerHTML = `<option value="Tümü">Tüm Dersler</option>` +
        names.map(d => `<option value="${escapeHtml(d)}" ${filterState.ders === d ? "selected" : ""}>${escapeHtml(d)}</option>`).join("");
    }

    async function refreshCurriculum() {
      const listEl = document.getElementById("curriculumList");
      if (filterState.ders === "Tümü" && !filterState.q.trim()) {
        const topics = await getFilteredTopics({
          year: filterState.year,
          session: filterState.session,
          puan_turu: filterState.puan_turu,
          ders: "Tümü",
          q: "",
        });
        const counts = new Map();
        for (const t of topics) {
          counts.set(t.ders, (counts.get(t.ders) || 0) + 1);
        }
        if (!counts.size) {
          listEl.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8">Uygun ders bulunamadı.</div>';
          return;
        }
        const cards = Array.from(counts.entries()).map(([ders, count]) => `
          <div class="subject-card" onclick="pickSubject('${escapeHtml(ders).replace(/'/g, "\\'")}')">
            <div>
              <div style="font-weight:700; font-size:13.5px">${escapeHtml(ders)}</div>
              <div style="font-size:12px; color:var(--muted)">${count} konu</div>
            </div>
            <span style="color:var(--primary); font-weight:700">›</span>
          </div>
        `).join("");
        listEl.innerHTML = `
          <div style="font-size:12px; color:var(--muted); margin-bottom:8px">
            Konuları görmek için bir ders seçin veya yukarıdan arama yapın:
          </div>
          <div class="subject-grid">${cards}</div>
        `;
        return;
      }

      const topics = await getFilteredTopics(filterState);
      if (!topics.length) {
        listEl.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8">Aramaya uygun konu bulunamadı.</div>';
        return;
      }

      // Subject -> Unit -> Topics gruplaması
      const sectionsMap = new Map();
      for (const t of topics) {
        const subjKey = `${t.session} · ${t.ders}`;
        if (!sectionsMap.has(subjKey)) sectionsMap.set(subjKey, new Map());
        const unitMap = sectionsMap.get(subjKey);
        if (!unitMap.has(t.unite)) unitMap.set(t.unite, []);
        unitMap.get(t.unite).push(t);
      }

      const autoOpen = Boolean(filterState.q.trim()) || filterState.ders !== "Tümü";
      const headerHtml = `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px">
          <span style="font-size:12px; color:var(--muted)">${topics.length} konu listeleniyor</span>
          ${filterState.ders !== "Tümü" ? `<button class="btn btn-ghost btn-xs" onclick="pickSubject('Tümü')">← Tüm Dersler</button>` : ""}
        </div>
      `;

      const sectionsHtml = Array.from(sectionsMap.entries()).map(([subjectKey, unitMap]) => {
        const units = Array.from(unitMap.entries());
        const subjTotal = units.reduce((a, [, ut]) => a + ut.length, 0);
        const unitsHtml = units.map(([uniteName, unitTopics]) => {
          const encodedTopics = encodeURIComponent(JSON.stringify(unitTopics));
          const isOpen = autoOpen && units.length <= 6 ? "open" : "";
          return `
            <details class="unit-details" ${isOpen}>
              <summary>
                <span>${escapeHtml(uniteName)}</span>
                <span style="font-size:11px; color:var(--muted)">${unitTopics.length} konu</span>
              </summary>
              <div class="unit-subbar">
                <span>${unitTopics.length} alt başlık</span>
                <button class="btn btn-ghost btn-xs" style="color:var(--primary)"
                  onclick="addUnitTopics('${encodedTopics}', '${escapeHtml(uniteName).replace(/'/g, "\\'")}')">+ Üniteyi Ekle</button>
              </div>
              <div>
                ${unitTopics.map(t => {
                  const meta = [t.sinif, t.session !== "TYT" ? t.puan_turu : "", t.agirlik].filter(Boolean).join(" · ");
                  const encTopic = encodeURIComponent(JSON.stringify(t));
                  return `
                    <div class="topic-row">
                      <div style="min-width:0; flex:1">
                        <div class="topic-title">${escapeHtml(t.konu)}</div>
                        ${meta ? `<div class="topic-meta">${escapeHtml(meta)}</div>` : ""}
                      </div>
                      <div style="display:flex; align-items:center; gap:4px; flex-shrink:0">
                        ${t.kazanim ? `<button class="btn btn-ghost btn-xs" title="Kazanım detayı" onclick="openKazanimModal('${encTopic}')">ⓘ</button>` : ""}
                        <button class="btn btn-primary btn-xs"
                          onclick="addTopic('${escapeHtml(t.full_ders).replace(/'/g, "\\'")}', '${escapeHtml(t.konu).replace(/'/g, "\\'")}')">+ Ekle</button>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </details>
          `;
        }).join("");

        return `
          <div class="unit-box">
            <div class="subject-header">
              <span>${escapeHtml(subjectKey)}</span>
              <span>${subjTotal} konu</span>
            </div>
            ${unitsHtml}
          </div>
        `;
      }).join("");

      listEl.innerHTML = headerHtml + sectionsHtml;
    }

    window.pickSubject = async (dersName) => {
      filterState.ders = dersName;
      document.getElementById("filterDers").value = dersName;
      await refreshCurriculum();
    };

    // ------------------------------------------------------------------ //
    // Modallar
    // ------------------------------------------------------------------ //
    function openModal(html) {
      document.getElementById("modalContent").innerHTML = html;
      document.getElementById("modalBackdrop").classList.add("open");
    }
    window.closeModal = () => {
      document.getElementById("modalBackdrop").classList.remove("open");
    };
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    window.openKazanimModal = (encTopic) => {
      const t = JSON.parse(decodeURIComponent(encTopic));
      openModal(`
        <div class="modal-title">${escapeHtml(t.konu)}</div>
        <div style="font-size:12px; color:var(--primary); font-weight:600; margin-bottom:10px">${escapeHtml(t.session)} · ${escapeHtml(t.ders)} · ${escapeHtml(t.unite)}</div>
        <div style="font-size:13.5px; color:#334155; line-height:1.55">${escapeHtml(t.kazanim)}</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Kapat</button>
          <button class="btn btn-primary" onclick="addTopic('${escapeHtml(t.full_ders).replace(/'/g, "\\'")}', '${escapeHtml(t.konu).replace(/'/g, "\\'")}'); closeModal()">+ Aktif Güne Ekle</button>
        </div>
      `);
    };

    window.openCustomModal = (day) => {
      const def = getQuickDefaults();
      openModal(`
        <div class="modal-title">${day} — Özel Görev Ekle</div>
        <div class="field"><label>Ders</label><input id="cDers" class="input" style="width:100%" placeholder="Örn: Genel Deneme / TYT Türkçe" /></div>
        <div class="field"><label>Konu / Görev</label><input id="cKonu" class="input" style="width:100%" placeholder="Örn: TYT Genel Deneme + Analiz" /></div>
        <div style="display:flex; gap:10px">
          <div class="field" style="flex:1"><label>Çalışma Türü</label>
            <select id="cType" class="select" style="width:100%">${STUDY_TYPES.map(s => `<option ${s === def.study_type ? "selected" : ""}>${s}</option>`).join("")}</select>
          </div>
          <div class="field" style="width:120px"><label>Hedef Soru</label><input id="cQ" type="number" min="0" step="5" class="input" style="width:100%" value="${def.target_questions || 30}" /></div>
        </div>
        <div class="field"><label>Not (İsteğe bağlı)</label><input id="cNote" class="input" style="width:100%" placeholder="Örn: Süre tutarak" /></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
          <button class="btn btn-primary" onclick="saveCustomTask('${day}')">Ekle</button>
        </div>
      `);
    };

    window.saveCustomTask = (day) => {
      const ders = document.getElementById("cDers").value.trim();
      const konu = document.getElementById("cKonu").value.trim();
      if (!ders || !konu) return alert("Ders ve Konu alanları zorunludur.");
      const q = parseInt(document.getElementById("cQ").value || "0", 10);
      currentWeek()[day].push({
        ders,
        konu,
        study_type: document.getElementById("cType").value,
        target_questions: q > 0 ? q : null,
        note: document.getElementById("cNote").value.trim(),
      });
      state.active_day = day;
      closeModal();
      renderSchedule();
    };

    window.openCopyModal = (sourceDay, taskIdx) => {
      const t = currentWeek()[sourceDay][taskIdx];
      openModal(`
        <div class="modal-title">Görevi Başka Güne Kopyala</div>
        <div style="font-size:12px; color:var(--muted); margin-bottom:10px">${escapeHtml(t.ders)} — ${escapeHtml(t.konu)}</div>
        <div class="field"><label>Hedef Gün</label>
          <select id="copyTargetDay" class="select" style="width:100%">
            ${DAYS.map(d => `<option value="${d}" ${d === sourceDay ? "selected" : ""}>${d}</option>`).join("")}
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
          <button class="btn btn-primary" onclick="confirmCopyTask('${sourceDay}', ${taskIdx})">Kopyala</button>
        </div>
      `);
    };

    window.confirmCopyTask = (sourceDay, taskIdx) => {
      const target = document.getElementById("copyTargetDay").value;
      const copy = JSON.parse(JSON.stringify(currentWeek()[sourceDay][taskIdx]));
      currentWeek()[target].push(copy);
      closeModal();
      renderSchedule();
      notify(`${target} gününe kopyalandı`);
    };

    function openRoutineModal() {
      openModal(`
        <div class="modal-title">Rutin Dağıtıcı (Çoklu Güne Ekle)</div>
        <div style="font-size:12px; color:var(--muted); margin-bottom:10px">Paragraf, Problem veya tekrar rutinlerini seçili günlere tek tıkla dağıtın.</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px">
          <button class="btn btn-outline btn-xs" onclick="fillRoutine('TYT Türkçe','Paragraf Rutini','Soru Çözümü',20)">20 Paragraf</button>
          <button class="btn btn-outline btn-xs" onclick="fillRoutine('TYT Matematik','Problem Rutini','Soru Çözümü',20)">20 Problem</button>
          <button class="btn btn-outline btn-xs" onclick="fillRoutine('TYT Geometri','Geometri Rutini','Soru Çözümü',20)">20 Geometri</button>
          <button class="btn btn-outline btn-xs" onclick="fillRoutine('Genel Deneme','TYT Genel Deneme + Analiz','Deneme',120)">TYT Deneme</button>
        </div>
        <div class="field"><label>Ders</label><input id="rDers" class="input" style="width:100%" value="TYT Türkçe" /></div>
        <div class="field"><label>Konu / Rutin Açıklaması</label><input id="rKonu" class="input" style="width:100%" value="Paragraf Rutini" /></div>
        <div style="display:flex; gap:10px">
          <div class="field" style="flex:1"><label>Çalışma Türü</label>
            <select id="rType" class="select" style="width:100%">${STUDY_TYPES.map(s => `<option ${s === "Soru Çözümü" ? "selected" : ""}>${s}</option>`).join("")}</select>
          </div>
          <div class="field" style="width:120px"><label>Hedef Soru</label><input id="rQ" type="number" min="0" step="5" class="input" style="width:100%" value="20" /></div>
        </div>
        <div class="field">
          <label>Günler</label>
          <div style="display:flex; gap:10px; flex-wrap:wrap; font-size:12.5px">
            ${DAYS.map(d => `<label style="display:inline-flex; align-items:center; gap:4px; font-weight:500"><input type="checkbox" class="r-day" value="${d}" ${d !== "PAZAR" ? "checked" : ""} /> ${d}</label>`).join("")}
          </div>
          <div style="display:flex; gap:6px; margin-top:6px">
            <button class="btn btn-ghost btn-xs" onclick="setRoutineDays(false)">Hafta İçi</button>
            <button class="btn btn-ghost btn-xs" onclick="setRoutineDays(true)">Tüm Hafta</button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
          <button class="btn btn-primary" onclick="applyRoutine()">Seçili Günlere Dağıt</button>
        </div>
      `);
    }
    window.fillRoutine = (d, k, t, q) => {
      document.getElementById("rDers").value = d;
      document.getElementById("rKonu").value = k;
      document.getElementById("rType").value = t;
      document.getElementById("rQ").value = q;
    };
    window.setRoutineDays = (all) => {
      document.querySelectorAll(".r-day").forEach(cb => {
        cb.checked = all || (cb.value !== "CUMARTESİ" && cb.value !== "PAZAR");
      });
    };
    window.applyRoutine = () => {
      const ders = document.getElementById("rDers").value.trim();
      const konu = document.getElementById("rKonu").value.trim();
      const st = document.getElementById("rType").value;
      const q = parseInt(document.getElementById("rQ").value || "0", 10);
      const selected = Array.from(document.querySelectorAll(".r-day:checked")).map(c => c.value);
      if (!ders || !konu || !selected.length) return alert("Ders, konu ve en az 1 gün seçmelisiniz.");
      for (const d of selected) {
        currentWeek()[d].push({ ders, konu, study_type: st, target_questions: q > 0 ? q : null, note: "" });
      }
      closeModal();
      renderSchedule();
      notify(`'${konu}' ${selected.length} güne eklendi`);
    };

    // ------------------------------------------------------------------ //
    // Excel Export (Yerel FastAPI -> GitHub Pages Pyodide Fallback)
    // ------------------------------------------------------------------ //
    let pyodideReadyPromise = null;

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) return resolve();
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("Dış kaynak yüklenemedi"));
        document.head.appendChild(s);
      });
    }

    async function getPyodideEngine() {
      if (!pyodideReadyPromise) {
        pyodideReadyPromise = (async () => {
          await loadScriptOnce("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
          const pyodide = await window.loadPyodide();
          await pyodide.loadPackage(["micropip", "pillow"]);
          await pyodide.runPythonAsync(`
            import micropip
            await micropip.install("openpyxl")
          `);

          pyodide.FS.mkdirTree("/app/templates");
          pyodide.FS.mkdirTree("/app/data");
          const [currCode, expCode, tpl1Buf, tpl2Buf, tpl3Buf] = await Promise.all([
            fetch("./curriculum.py").then(r => r.text()),
            fetch("./excel_exporter.py").then(r => r.text()),
            fetch("./templates/haftalik_bos.xlsx").then(r => r.arrayBuffer()),
            fetch("./templates/kompakt_sablon.xlsx").then(r => r.arrayBuffer()),
            fetch("./templates/aylik_matris.xlsx").then(r => r.arrayBuffer()),
          ]);
          pyodide.FS.writeFile("/app/curriculum.py", currCode);
          pyodide.FS.writeFile("/app/excel_exporter.py", expCode);
          pyodide.FS.writeFile("/app/templates/haftalik_bos.xlsx", new Uint8Array(tpl1Buf));
          pyodide.FS.writeFile("/app/templates/kompakt_sablon.xlsx", new Uint8Array(tpl2Buf));
          pyodide.FS.writeFile("/app/templates/aylik_matris.xlsx", new Uint8Array(tpl3Buf));

          await pyodide.runPythonAsync(`
            import sys
            if "/app" not in sys.path:
                sys.path.insert(0, "/app")
            import json
            from excel_exporter import (
                ScheduleTask,
                export_single_week_excel,
                export_compact_four_weeks_excel,
                export_monthly_matrix_excel,
            )

            def run_export_from_json(payload_json: str) -> bytes:
                payload = json.loads(payload_json)
                labels = payload.get("week_labels", ["1. Hafta", "2. Hafta", "3. Hafta", "4. Hafta"])
                mode = payload.get("template_mode", "single")

                if mode == "monthly":
                    return export_monthly_matrix_excel(
                        matrix_weeks=payload.get("monthly_matrix", []),
                        student_name=payload.get("student_name", ""),
                        week_labels=labels,
                    )

                weeks_conv = []
                for w in payload.get("weeks", []):
                    w_dict = {}
                    for day, items in w.items():
                        w_dict[day] = [
                            ScheduleTask(
                                ders=item.get("ders", ""),
                                konu=item.get("konu", ""),
                                study_type=item.get("study_type", "Soru Çözümü"),
                                target_questions=item.get("target_questions"),
                                note=item.get("note", ""),
                            )
                            for item in items
                        ]
                    weeks_conv.append(w_dict)

                if mode == "single":
                    return export_single_week_excel(
                        week_plan=weeks_conv[0] if weeks_conv else {},
                        student_name=payload.get("student_name", ""),
                        week_title=labels[0] if labels else "",
                    )
                return export_compact_four_weeks_excel(
                    weeks=weeks_conv,
                    student_name=payload.get("student_name", ""),
                    week_labels=labels,
                )
          `);
          return pyodide;
        })().catch(err => {
          pyodideReadyPromise = null;
          throw err;
        });
      }
      return pyodideReadyPromise;
    }

    function safeFilePart(name, fallback) {
      const cleaned = String(name || "").replace(/[^a-zA-Z0-9çğıöşüÇĞİÖŞÜ _-]/g, "").trim().replace(/\s+/g, "_");
      return cleaned || fallback;
    }

    function triggerBlobDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function exportExcel() {
      const btn = document.getElementById("btnExport");
      btn.disabled = true;
      btn.textContent = "Hazırlanıyor...";

      const payload = {
        student_name: state.student_name,
        template_mode: state.template_mode,
        week_labels: state.week_labels,
        weeks: state.weeks,
        monthly_matrix: state.monthly_matrix,
      };
      const baseName = safeFilePart(state.student_name, "Ogrenci");
      const defaultFilename = state.template_mode === "single"
        ? `${baseName}_${safeFilePart(state.week_labels[0], "1_Hafta")}_Program.xlsx`
        : state.template_mode === "monthly"
          ? `${baseName}_Aylik_Gelisim_Matrisi.xlsx`
          : `${baseName}_4_Haftalik_Kompakt_Program.xlsx`;

      try {
        let usedApi = false;
        try {
          const res = await fetch("./api/export", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (res.ok) {
            const blob = await res.blob();
            let filename = defaultFilename;
            const cd = res.headers.get("Content-Disposition") || "";
            const m = cd.match(/filename\*=UTF-8''([^;]+)/i);
            if (m) filename = decodeURIComponent(m[1]);
            triggerBlobDownload(blob, filename);
            notify(`Excel indirildi: ${filename}`);
            usedApi = true;
          }
        } catch (_) {}

        if (!usedApi) {
          const pyodide = await getPyodideEngine();
          pyodide.globals.set("payload_json_js", JSON.stringify(payload));
          const pyBytes = pyodide.runPython("run_export_from_json(payload_json_js)");
          const uint8 = pyBytes.toJs({ create_proxies: false });
          pyBytes.destroy();
          const blob = new Blob([uint8], {
            type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          });
          triggerBlobDownload(blob, defaultFilename);
          notify(`Excel indirildi: ${defaultFilename}`);
        }
      } catch (err) {
        console.error(err);
        alert("Excel oluşturulurken hata oluştu.");
      } finally {
        btn.disabled = false;
        btn.textContent = "⬇ Excel Olarak İndir";
      }
    }

    // ------------------------------------------------------------------ //
    // Olay Bağlantıları ve Başlatma
    // ------------------------------------------------------------------ //
    document.getElementById("studentName").addEventListener("input", (e) => {
      state.student_name = e.target.value;
      saveState();
    });
    document.getElementById("weekLabelInput").addEventListener("input", (e) => {
      state.week_labels[currentWeekIdx()] = e.target.value;
      saveState();
    });

    document.querySelectorAll("#modeToggle button").forEach(btn => {
      btn.addEventListener("click", () => {
        state.template_mode = btn.dataset.mode;
        renderSchedule();
      });
    });

    document.querySelectorAll("#yearToggle button").forEach(btn => {
      btn.addEventListener("click", async () => {
        filterState.year = Number(btn.dataset.year);
        document.querySelectorAll("#yearToggle button").forEach(b => b.classList.toggle("active", b === btn));
        await refreshSubjectsDropdown();
        await refreshCurriculum();
      });
    });

    document.getElementById("filterSession").addEventListener("change", async (e) => {
      filterState.session = e.target.value;
      await refreshSubjectsDropdown();
      await refreshCurriculum();
    });
    document.getElementById("filterPuan").addEventListener("change", async (e) => {
      filterState.puan_turu = e.target.value;
      await refreshSubjectsDropdown();
      await refreshCurriculum();
    });
    document.getElementById("filterDers").addEventListener("change", async (e) => {
      filterState.ders = e.target.value;
      await refreshCurriculum();
    });

    let searchTimer = null;
    document.getElementById("searchInput").addEventListener("input", (e) => {
      filterState.q = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(refreshCurriculum, 120);
    });

    document.querySelectorAll(".q-preset").forEach(btn => {
      btn.addEventListener("click", () => {
        document.getElementById("defaultQuestions").value = btn.dataset.q;
        if (btn.dataset.q === "0") {
          document.getElementById("defaultType").value = "Konu";
        }
      });
    });

    document.getElementById("btnRoutine").addEventListener("click", openRoutineModal);
    window.clearActiveWeek = () => {
      if (state.template_mode === "monthly") {
        state.monthly_matrix[currentWeekIdx()] = emptyMatrixWeek();
      } else {
        state.weeks[currentWeekIdx()] = emptyWeek();
      }
      closeModal();
      renderSchedule();
      notify("Hafta temizlendi");
    };
    function hasAnyProgramData() {
      if ((state.student_name || "").trim()) return true;
      for (let i = 0; i < 4; i++) {
        if ((state.week_labels[i] || "").trim() !== `${i + 1}. Hafta`) return true;
        for (const d of DAYS) {
          if ((state.weeks[i][d] || []).length > 0) return true;
        }
        for (const s of MATRIX_SUBJECTS) {
          const entry = state.monthly_matrix[i][s];
          if (entry && (entry.topics.length > 0 || Number(entry.target_questions || 0) > 0)) return true;
        }
      }
      return false;
    }

    window.startNewProgram = () => {
      state.student_name = "";
      state.active_week_idx = 0;
      state.week_labels = ["1. Hafta", "2. Hafta", "3. Hafta", "4. Hafta"];
      state.weeks = [emptyWeek(), emptyWeek(), emptyWeek(), emptyWeek()];
      state.monthly_matrix = [emptyMatrixWeek(), emptyMatrixWeek(), emptyMatrixWeek(), emptyMatrixWeek()];
      state.active_day = "PAZARTESİ";
      state.active_matrix_subject = "TÜRKÇE";
      closeModal();
      renderSchedule();
      document.getElementById("studentName").focus();
      notify("Yeni boş program hazırlandı");
    };

    document.getElementById("btnNewProgram").addEventListener("click", () => {
      if (!hasAnyProgramData()) {
        window.startNewProgram();
        return;
      }
      openModal(`
        <div class="modal-title">Yeni Program Başlat</div>
        <div style="font-size:13.5px; color:#475569">Öğrenci adı, hafta başlıkları, tüm haftalar ve aylık matristeki mevcut içerik sıfırlanacak. Emin misiniz?</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Vazgeç</button>
          <button class="btn btn-primary" style="background:var(--danger)" onclick="startNewProgram()">Evet, Yeni Program Başlat</button>
        </div>
      `);
    });

    document.getElementById("btnClear").addEventListener("click", () => {
      openModal(`
        <div class="modal-title">Haftayı Temizle</div>
        <div style="font-size:13.5px; color:#475569">Aktif haftadaki tüm ders ve konular silinecek. Emin misiniz?</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Vazgeç</button>
          <button class="btn btn-primary" style="background:var(--danger)" onclick="clearActiveWeek()">Evet, Temizle</button>
        </div>
      `);
    });
    document.getElementById("btnExport").addEventListener("click", exportExcel);

    renderSchedule();
    refreshSubjectsDropdown().then(refreshCurriculum);
  </script>
</body>
</html>
